name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-capacitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: npx @capacitor/assets generate --android
      - name: Portrait + version
        run: |
          sed -i 's/<activity /<activity android:screenOrientation="portrait" /' android/app/src/main/AndroidManifest.xml
          sed -i 's/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName "1.0"/versionName "1.0.${{ github.run_number }}"/' android/app/build.gradle
      - run: npx cap sync android
      - name: Build release
        working-directory: android-capacitor/android
        run: chmod +x gradlew && ./gradlew assembleRelease
      - name: Keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -z "$KS_PASS" ]; then echo "Set secret KEYSTORE_PASS first"; exit 1; fi
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > ../foxfury.jks
          else keytool -genkeypair -keystore ../foxfury.jks -alias foxfury -keyalg RSA -keysize 2048 -validity 12000 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=FoxFury"; mkdir -p ../keystore-out && cp ../foxfury.jks ../keystore-out/; fi
      - name: Sign
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          U=android/app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -p 4 $U aligned.apk
          $BT/apksigner sign --ks ../foxfury.jks --ks-key-alias foxfury --ks-pass pass:"$KS_PASS" --out FoxFury.apk aligned.apk
      - uses: actions/upload-artifact@v4
        with: { name: FoxFury-APK, path: android-capacitor/FoxFury.apk }
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('keystore-out/foxfury.jks') != '' }}
        with: { name: KEYSTORE-SAVE-THIS, path: keystore-out/foxfury.jks }
